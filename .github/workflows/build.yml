
name: Build ARM64 muOS prototype

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev zip

      - name: Compile ARM64
        run: make

      - name: Package executable
        run: |
          mkdir -p dist/PokemonBrowser
          cp pokemon-browser launch.sh dist/PokemonBrowser/
          chmod +x dist/PokemonBrowser/launch.sh
          cd dist
          zip -r ../pokemon-browser-arm64.zip PokemonBrowser

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-browser-arm64
          path: pokemon-browser-arm64.zip

